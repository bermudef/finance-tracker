name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance_dev_password
          POSTGRES_DB: finance_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Wait for database to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U finance; then
              echo "Database ready"
              break
            fi
            sleep 1
          done
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Verify migrations apply cleanly
        working-directory: backend
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://finance:finance_dev_password@localhost:5432/finance_test_db
      - name: Run test suite
        working-directory: backend
        run: python -m pytest tests/ -q
        env:
          DATABASE_URL: postgresql+asyncpg://finance:finance_dev_password@localhost:5432/finance_test_db

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check and build
        working-directory: frontend
        run: npm run build
